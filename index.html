<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>off-point</title>
  <meta name="theme-color" content="#2196F3">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="sidebar">
      <div id="sidebar-handle"><span></span></div>

      <div id="sidebar-content">
        <div id="status-bar"></div>

        <!-- World view: list of regions -->
        <section id="panel-regions">
          <h2>Regions</h2>
          <ul id="region-list"></ul>
        </section>

        <!-- Region view: metadata + waypoints -->
        <section id="panel-detail" hidden>
          <h2 id="detail-name"></h2>
          <div id="detail-bounds" class="detail-meta"></div>
          <div id="detail-wp-count" class="detail-meta"></div>
          <h3>Waypoints</h3>
          <ol id="waypoint-list"></ol>
          <button id="btn-export" type="button" class="sidebar-btn">Export JSON</button>
        </section>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button id="btn-load" type="button">Load Map</button>
    <button id="btn-world" type="button" hidden>World View</button>
    <input type="file" id="file-input" accept=".pmtiles" hidden>
  </div>

  <script src="lib/leaflet.js"></script>
  <script src="lib/pmtiles.js"></script>
  <script src="lib/protomaps-leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
