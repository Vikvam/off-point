name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install

      - name: Prepare site
        run: |
          mkdir -p _site/lib
          cp node_modules/leaflet/dist/leaflet.js _site/lib/
          cp node_modules/leaflet/dist/leaflet.css _site/lib/
          cp -r node_modules/leaflet/dist/images _site/lib/
          cp node_modules/pmtiles/dist/pmtiles.js _site/lib/
          cp node_modules/protomaps-leaflet/dist/protomaps-leaflet.js _site/lib/
          cp node_modules/idb-keyval/dist/index.js _site/lib/idb-keyval.js
          cp index.html style.css manifest.json sw.js _site/
          cp -r js icons _site/
          cp -r data _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
